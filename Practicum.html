<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>

<body>
    <form action="\submit.php" method="POST"></form>
    <label for="First Name">First Name</label>
    <input type="text" id="First Name" minlength="4" maxlength="8" required> <br>

    <label for="Last Name">Last Name</label>
    <input type="text" id="Last Name" minlength="4" maxlength="8" required> <br>

    <label for="Address">Address</label><br>

    <label for="Number and Street">Number and City</label>
    <input type="text" id="Number and Street" required> <br>

    <label for="City">City</label>
    <input type="text" id="City" required><br>

    <label for="State">State</label>
    <input type="text" id="State" required><br>

    <label for="Zip Code">Zip Code</label>
    <input type="Zip Code" id="Zip Code" required><br>

    <label for="Check-in Date">Check Date</label>
    <input type="date" id="Check-in Date"><br>

    <label for="Check-out Date">Check Date</label>
    <input type="date" id="Check-out Date"><br>

    <label for="Phone">Phone</label>
    <input type="tel" id="Phone" placeholder="01234-56789" pattern="[0-9]{5}-[0-9]{5}" required><br>


    <label for="E-mail Address">E-mail Address</label>
    <input type="mailto" id="E-mail Address" placeholder="name@domain.com"><br>


    <label for="Payment method">Payment method</label>
    <input type="text" id="Payment method" required><br>


    <label for="Card number">Card number</label>
    <input type="text" id="Card number" required><br>



    <label for="Special request"></label>
    <textarea id="requests" name="requests" rows="4" cols="30" placeholder="Enter your request here"></textarea>






    <input type="Submit">
    <input type="Reset">
</body>

</html>
